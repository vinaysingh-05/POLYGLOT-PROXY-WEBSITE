<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e103d" />
      <stop offset="70%" stop-color="#0a0618" />
      <stop offset="100%" stop-color="#05030d" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c4b5fd" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Outer ambient ring -->
  <circle cx="32" cy="32" r="22" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- Orbit 1 -->
  <ellipse cx="32" cy="32" rx="21" ry="8" stroke="#a78bfa" stroke-width="1.75" transform="rotate(-35 32 32)" filter="url(#glow)" />
  <!-- Orbit 2 -->
  <ellipse cx="32" cy="32" rx="21" ry="8" stroke="#c4b5fd" stroke-width="1.75" transform="rotate(35 32 32)" filter="url(#glow)" />

  <!-- Satellite nodes -->
  <circle cx="16" cy="21" r="2.2" fill="#ffffff" filter="url(#glow)" />
  <circle cx="48" cy="43" r="2.2" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="47" cy="21" r="2" fill="#34d399" filter="url(#glow)" />

  <!-- Central luminous core -->
  <circle cx="32" cy="32" r="8" fill="url(#coreGlow)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
</svg>